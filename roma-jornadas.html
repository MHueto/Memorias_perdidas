<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101923"><title>Jornadas de Roma · Memórias Perdidas</title><link rel="stylesheet" href="css/roma-campaign.css?v=11"></head>
<body class="journey-page">
<main id="journeyShell" class="journey-shell" aria-label="Jornada histórica de Renato">
 <section id="journeyViewport" class="journey-viewport" aria-label="Cenário: use A e D ou as setas para andar; E para interagir" tabindex="0"><div id="journeyWorld" class="journey-world"><img id="journeyBackground" class="journey-background" alt=""><div id="journeyGlitches" class="journey-glitches" aria-hidden="true"></div><div id="journeyProps" class="journey-props"></div><div id="journeyPeople" class="journey-people" aria-hidden="true"></div><div id="journeyShadow" class="journey-shadow" aria-hidden="true"></div><div id="journeyRenato" class="journey-renato" aria-label="Renato"></div></div></section>
 <header class="journey-hud"><a href="campanha-roma.html" aria-label="Voltar à linha do tempo">← Memórias</a><details id="journeyQuest"><summary id="journeyEra">Investigação</summary><p id="journeyObjective"></p><button id="journeyGuide" type="button">Onde procurar?</button></details><button id="journeyBook" type="button">Caderno · B</button></header>
 <div id="journeyLoading" class="journey-loading" role="status"><p>Reconstituindo a memória…</p><button id="journeyRetry" type="button" hidden>Tentar carregar novamente</button><a href="campanha-roma.html">Voltar às memórias</a></div>
 <p id="journeyToast" class="journey-toast" role="status" hidden></p>
 <footer class="journey-controls"><div class="journey-direction"><button type="button" data-move="left" aria-label="Andar para a esquerda">←</button><button type="button" data-move="right" aria-label="Andar para a direita">→</button></div><span id="journeyPlace"></span><button id="journeyInteract" type="button" aria-label="Interagir">Interagir · E</button></footer>
 <dialog id="journeyDialog" class="journey-dialog" aria-labelledby="journeyDialogTitle"><div class="journey-dialog-shell"><header><div><small id="journeyDialogEyebrow">REGISTROS DO COFRE</small><h2 id="journeyDialogTitle"></h2></div><button id="journeyClose" type="button">Fechar · Esc</button></header><div id="journeyDialogBody" class="journey-dialog-body"></div><footer id="journeyDialogActions"></footer></div></dialog>
</main>
<noscript>Ative o JavaScript para jogar.</noscript>
<script src="js/roma-campaign-data.js?v=11"></script><script src="js/roma-campaign.js?v=11"></script><script src="js/roma-journey.js?v=11"></script>
