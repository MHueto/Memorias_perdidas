<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020712">
    <title>Memórias Perdidas — Teste da escola</title>
    <link rel="stylesheet" href="css/teste-escola.css">
</head>
<body class="school-test-body">
    <main class="school-test" aria-label="Teste de exploração da escola">
        <section class="game-shell">
            <div id="gameViewport" class="game-viewport" tabindex="0" role="application" aria-label="Mapa da escola. Use as setas ou WASD para mover Edric.">
                <div id="schoolWorld" class="school-world" aria-hidden="true">
                    <div id="mapTiles" class="school-world__map" aria-hidden="true"></div>
                    <canvas id="areaVeil" class="area-veil" aria-hidden="true"></canvas>
                    <div id="edric" class="edric"></div>
                    <canvas id="awningLayer" class="school-world__awning" aria-hidden="true"></canvas>
                </div>
            </div>

            <header class="game-hud">
                <a class="hud-button hud-button--back" href="index.html">&larr; Menu</a>
                <div class="hud-card hud-card--status" aria-live="polite">
                    <span class="hud-label">Teste de animação</span>
                    <strong id="playerState">Edric parado — olhando para cima</strong>
                </div>
                <div class="hud-card hud-card--map" aria-live="polite">
                    <span class="hud-label">Portas liberadas</span>
                    <strong id="explorationStatus">Lendo mapa…</strong>
                </div>
            </header>

            <aside class="game-help" aria-label="Controles">
                <span class="help-mark">MOVIMENTO</span>
                <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ou <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></p>
                <p><kbd>Shift</kbd> corre &nbsp;•&nbsp; câmera fixa em 185%</p>
            </aside>

            <div class="touch-controls" aria-label="Controles na tela">
                <button type="button" class="touch-button touch-button--up" data-direction="up" aria-label="Mover para cima">↑</button>
                <button type="button" class="touch-button touch-button--left" data-direction="left" aria-label="Mover para esquerda">←</button>
                <button type="button" class="touch-button touch-button--down" data-direction="down" aria-label="Mover para baixo">↓</button>
                <button type="button" class="touch-button touch-button--right" data-direction="right" aria-label="Mover para direita">→</button>
            </div>
        </section>
    </main>

    <noscript>Ative o JavaScript para testar o movimento de Edric.</noscript>
    <script src="js/teste-escola.js"></script>
</body>
</html>
