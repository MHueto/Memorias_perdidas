<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memórias Perdidas — Menu Principal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/configuracoes.css">
</head>
<body>
    <!-- Background de Vídeo -->
    <div class="menu-background" aria-hidden="true">
        <video class="menu-background__video is-visible" muted playsinline preload="auto" poster="assets/images/background_img.jpeg">
            <source src="assets/images/memorias_perdidas_corredor_loop_pixelart_720p.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Botão de Áudio -->
    <button id="btn-mudo" class="btn-mudo" title="Alternar Som">🔊</button>

    <!-- Conteúdo Principal -->
    <main class="conteudo">
        <h1 class="titulo-jogo">Memórias <br> Perdidas</h1>

        <nav class="menu">
            <button id="btn-jogar" class="button b1">Jogar</button>
            <button id="btn-config" class="button b2">Configurações</button>
            <button id="btn-controles" class="button b3">Controles</button>
        </nav>
    </main>

    <!-- Modais e Notificações -->
    <div id="notificacao-controles" class="notificacao">
       <h3>Controles</h3>
       <p>⬅️ ➡️ : Mover</p>
       <p>⬆️ : Pular</p>
       <p>Espaço : Atacar / Interagir</p>
    </div>

    <!-- Modal de Configurações -->
    <div id="modal-config" class="modal-overlay">
        <div class="modal-conteudo">
            <h2>Configurações</h2>
            <div class="config-item">
                <label>Volume</label>
                <input type="range" id="volume" name="volume" min="0" max="100">
            </div>
            <div class="config-item">
                <label>Mover Esquerda</label>
                <button class="rebind-btn" data-acao="esquerda">←</button>
            </div>
            <div class="config-item">
                <label>Mover Direita</label>
                <button class="rebind-btn" data-acao="direita">→</button>
            </div>
            <div class="config-item">
                <label>Pular</label>
                <button class="rebind-btn" data-acao="pular">↑</button>
            </div>
            <button class="fechar-config">Fechar</button>
        </div>
    </div>

    <!-- Modal de Início de Jogo -->
    <div id="modal-jogar" class="modal-overlay">
        <div class="modal-menu-jogar">
            <button class="button btn-continuar">Continuar</button>
            <button class="button btn-novo-jogo">Novo Jogo</button>
            <button class="button" id="btn-campanha-roma">Memórias de Roma</button>
            <button class="button fechar-modal">Voltar</button>
        </div>
    </div>

    <!-- Modal de Slots de Save -->
    <div id="modal-slots" class="modal-overlay">
        <div class="modal-conteudo">
            <h2>Escolha seu Jogo</h2>
            <div class="slot-container">
                <button class="button slot-btn" data-slot="1">Jogo 1</button>
                <button class="button slot-btn" data-slot="2">Jogo 2</button>
                <button class="button slot-btn" data-slot="3">Jogo 3</button>
            </div>
            <button class="button fechar-modal">Voltar</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/roma-campaign.js?v=11"></script>
    <script src="js/main.js?v=campanha-11"></script>
    <script src="js/configuracoes.js" defer></script>
    <script src="js/menu-background.js" defer></script>
</body>
</html>
